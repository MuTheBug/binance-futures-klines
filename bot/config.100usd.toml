# v4 bot preset for a $100 account. Copy to bot/config.toml (or pass -c bot/config.100usd.toml).
# API keys are NOT read from this file: export BINANCE_API_KEY / BINANCE_API_SECRET.
#
# What the evidence says (research/V5_PROTOCOL.md): v4 through the real bot pipeline from $100, on
# Binance's complete market with real funding and minimum order sizes.
#   - Fresh data never used in design (2026-06-08 -> 2026-11-09): $100 -> $100.16 at 1.5x with a
#     -27% drawdown; $101.07 at 1.0x with -18%. BTC rose 19% over the same months.
#   - Backtest Sharpe on complete data: 1.68 (2020-24), 2.46 (2025 - mid-2026); fresh months: 0.27.
#   - At $100, about 25-40% of the target size is skipped (orders below Binance's ~5 USDT minimum).
# The true edge is uncertain and probably well below the backtest. Paper trade.

mode = "paper"
state_dir = "bot_state_100"

[strategy]                  # = v4 defaults (k_hold 10, BTC-hedged pump sleeve)
w_trend = 0.70
w_pump = 0.30
target_vol = 0.40
pump_threshold = 0.25
pump_hold_days = 5
history_bars = 400
k_select = 6
k_hold = 10
pump_hedge = "btc"

[risk]
leverage = 1.0              # lowered from 1.5 after the fresh-data test: drawdown -27% at 1.5x, -18% at 1x
max_gross = 3.0
max_position = 0.50
max_drawdown = 0.35         # flatten + halt; review before `resume`
max_cycle_loss = 0.20
rebalance_band = 0.01
stop_loss_pct = 0.0

[exchange]
testnet = false
margin_type = "CROSSED"
exchange_leverage = 5
min_quote_volume_24h = 1000000
adopt_existing_positions = false   # use a dedicated sub-account

[paper]
initial_equity = 100.0      # paper account starts with $100
fee = 0.0005
slippage = 0.0002
data_source = "binance"
csv_dir = "."

[schedule]
run_minute_utc = 5
retry_minutes = 5
max_retries = 6

[notify]
webhook_url = ""
telegram_token = ""
telegram_chat_id = ""
